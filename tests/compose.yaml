services:
  rpc:
    image: python:3.13-alpine
    command: python /tests/fixtures/rpc.py
    volumes:
      - .:/tests:ro
  web:
    image: php:8.5-cli
    working_dir: /tmp/app
    command: /bin/sh -c "cp -a /src/application /src/system /src/public_html /src/tests /tmp/app/ && cp /src/tests/fixtures/supervisor.php /tmp/app/application/config/supervisor.php && exec php -d display_errors=1 -d error_reporting=-1 -S 0.0.0.0:8080 tests/fixtures/router.php"
    volumes:
      - ..:/src:ro
    ports:
      - '127.0.0.1:18085:8080'
